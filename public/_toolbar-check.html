<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/db-inventory.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { margin: 0; }
    .dashboard-shell { margin-top: 12px; height: auto; overflow: visible; }
  </style>
</head>
<body>
  <main class="dashboard-shell">
    <section class="workspace-grid">
      <div id="navbar-container" style="min-height:40px"></div>
      <section class="content-card history-content-card">
        <section class="history-toolbar" aria-label="History filters">
          <div class="history-toolbar-group history-category-row">
            <span class="history-category-label">Category</span>
            <div class="history-tab-group">
              <button class="history-category-btn is-active" type="button">All</button>
              <button class="history-category-btn" type="button">Lending</button>
              <button class="history-category-btn" type="button">Damaged</button>
            </div>
          </div>
          <label class="history-toolbar-group history-field history-sort-field">
            <span>Sort by</span>
            <select><option>Latest</option></select>
          </label>
          <div class="history-toolbar-group history-date-range">
            <span class="history-category-label">Date</span>
            <input type="date" />
            <span class="history-date-arrow">→</span>
            <input type="date" />
          </div>
          <button class="history-reset-btn" type="button">Reset</button>
          <div class="history-head-actions">
            <button class="history-copy-btn" type="button"><i class="bi bi-share"></i> Send a Copy</button>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script>
    // #region agent log
    window.measureToolbar = function (runId) {
      var toolbar = document.querySelector('.history-toolbar');
      var cs = getComputedStyle(toolbar);
      var kids = Array.prototype.map.call(toolbar.children, function (el) {
        return { cls: el.className, top: el.offsetTop, left: el.offsetLeft, w: el.offsetWidth, bottom: el.offsetTop + el.offsetHeight };
      });
      var tops = kids.map(function (k) { return k.top; });
      var copy = toolbar.querySelector('.history-copy-btn');
      var card = document.querySelector('.content-card');
      var payload = {
        sessionId: 'f29cc4',
        runId: runId || 'post-fix',
        hypothesisId: 'A-E',
        location: '_toolbar-check.html',
        message: 'history toolbar layout',
        data: {
          vw: window.innerWidth,
          toolbarW: toolbar.clientWidth,
          toolbarScroll: toolbar.scrollWidth,
          toolbarH: toolbar.offsetHeight,
          overflowX: toolbar.scrollWidth > toolbar.clientWidth + 1,
          flexWrap: cs.flexWrap,
          rowCount: tops.filter(function (t, i) { return tops.indexOf(t) === i; }).length,
          copyRight: copy.getBoundingClientRect().right,
          cardRight: card.getBoundingClientRect().right,
          clipped: copy.getBoundingClientRect().right > card.getBoundingClientRect().right + 1,
          kids: kids
        },
        timestamp: Date.now()
      };
      fetch('http://127.0.0.1:7591/ingest/35e57a72-783b-42fe-bb4e-563f8b0a56b3', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': 'f29cc4' },
        body: JSON.stringify(payload)
      }).catch(function () {});
      return payload.data;
    };
    // #endregion
  </script>
</body>
</html>
