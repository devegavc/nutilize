<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/db-inventory.css?v=spacing2" />
  <title>Analytics spacing check</title>
</head>
<body class="page-insights">
  <main class="dashboard-shell">
    <section class="workspace-grid">
      <section class="content-card analytics-content-card">
        <div class="dashboard-page-header-top insights-header-top" id="header">
          <div class="insights-header-copy"><h1 class="section-title" id="title">ANALYTICS</h1></div>
          <div class="insights-view-switch" id="switch">
            <button type="button" class="insights-view-tab">Equipment</button>
            <button type="button" class="insights-view-tab">Rooms</button>
          </div>
        </div>
        <section id="equipment-demand" class="equipment-demand-panel">
          <div class="equipment-demand-toolbar" id="toolbar">Filters</div>
          <div id="equipment-demand-results">
            <p id="equipment-demand-period-note" class="equipment-demand-note">October 2026</p>
            <div class="equipment-demand-block" id="block">
              <div class="equipment-demand-part-head">
                <h2 class="insight-card-title">Descriptive</h2>
                <p class="equipment-demand-note">What already happened.</p>
              </div>
              <section class="insight-kpi-strip equipment-demand-kpis" id="kpis">
                <div class="insight-kpi equipment-demand-kpi" id="card-a"><span class="insight-kpi-icon"></span><div class="insight-kpi-body"><strong>12</strong><span class="insight-kpi-label">Approved equipment reservations</span><em class="insight-kpi-hint">Hint</em></div></div>
                <div class="insight-kpi equipment-demand-kpi" id="card-b"><span class="insight-kpi-icon"></span><div class="insight-kpi-body"><strong>4</strong><span class="insight-kpi-label">Equipment types</span><em class="insight-kpi-hint">Hint</em></div></div>
                <div class="insight-kpi equipment-demand-kpi"><span class="insight-kpi-icon"></span><div class="insight-kpi-body"><strong>3</strong><span class="insight-kpi-label">Marked returned</span><em class="insight-kpi-hint">Hint</em></div></div>
                <div class="insight-kpi equipment-demand-kpi"><span class="insight-kpi-icon"></span><div class="insight-kpi-body"><strong id="equipment-summary-top">Jasmin Chairs</strong><span class="insight-kpi-label">Most frequently reserved</span><em class="insight-kpi-hint">Hint</em></div></div>
              </section>
            </div>
            <section class="inventory-grid analytics-table-grid insight-section equipment-demand-section" id="demand">
              <div class="inventory-grid-head analytics-grid-head insight-head"><div><h2>Most in-demand items</h2><p id="demand-copy">Approved demand is the planning basis.</p></div></div>
              <div class="table-wrap" id="demand-table"><table class="inventory-table analytics-table"><tr><td>Item</td></tr></table></div>
            </section>
            <section class="insight-panel equipment-demand-chart-panel" id="chart">
              <div class="equipment-demand-chart-head"><div><h2 class="insight-card-title">Weekly demand</h2><p class="insight-panel-hint" id="chart-copy">Subtitle</p></div></div>
              <p class="insight-panel-hint" id="equipment-weekly-unit">Units</p>
              <div class="insight-chart-frame equipment-weekly-frame" id="chart-frame"></div>
            </section>
          </div>
        </section>
      </section>
    </section>
  </main>
  <pre id="result"></pre>
  <script>
    const box = (id) => document.getElementById(id).getBoundingClientRect();
    const style = (id) => getComputedStyle(document.getElementById(id));
    const header = box('header');
    const title = box('title');
    const toggle = box('switch');
    const cards = box('kpis');
    const demand = box('demand');
    const chart = box('chart');
    const cardA = box('card-a');
    const cardB = box('card-b');
    const lines = [
      'header-display=' + style('header').display + ' justify=' + style('header').justifyContent,
      'title-left=' + Math.round(title.left) + ' toggle-right=' + Math.round(toggle.right) + ' header-right=' + Math.round(header.right),
      'toggle-gap-from-title=' + Math.round(toggle.left - title.right),
      'toggle-inset-from-header-right=' + Math.round(header.right - toggle.right),
      'card-gap=' + Math.round(cardB.left - cardA.right),
      'card-padding=' + style('card-a').paddingTop,
      'card-heights=' + Math.round(cardA.height) + ',' + Math.round(cardB.height),
      'kpi-to-demand=' + Math.round(demand.top - cards.bottom),
      'demand-to-chart=' + Math.round(chart.top - demand.bottom),
      'results-gap=' + style('equipment-demand-results').gap,
      'heading-to-copy=' + Math.round(box('demand-copy').top - document.querySelector('#demand h2').getBoundingClientRect().bottom),
      'copy-to-table=' + Math.round(box('demand-table').top - box('demand-copy').bottom),
      'viewport=' + window.innerWidth
    ];
    document.getElementById('result').textContent = lines.join('\n');
  </script>
</body>
</html>
